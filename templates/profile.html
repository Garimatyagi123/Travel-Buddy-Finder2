{% extends 'base.html' %}{% block title %}My profile — Travel Buddy Finder{% endblock %}{% block content %}<section class="page-top"><div class="container"><div class="eyebrow">YOUR TRAVEL IDENTITY</div><h1>A little about you.</h1><p>Help the right travel buddies find you.</p></div></section><section class="section-pad pt-4"><div class="container narrow"><form method="post" class="panel-form"><div class="profile-avatar">{{ user.name[:1]|upper }}</div><h2>{{ user.name }}</h2><p class="muted">{{ user.email }}</p><div class="row g-3 mt-2"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ user.name }}" required></div><div class="col-md-6"><label class="form-label">Home city</label><input class="form-control" name="city" value="{{ user.city }}" placeholder="e.g. Delhi"></div><div class="col-12"><label class="form-label">Short bio</label><textarea class="form-control" name="bio" rows="3" placeholder="What do you love about travelling?">{{ user.bio }}</textarea></div><div class="col-12"><label class="form-label">Travel interests <small>(comma-separated)</small></label><input class="form-control" name="interests" value="{{ user.interests }}" placeholder="Hiking, food, photography"></div><div class="col-md-6"><label class="form-label">Travel style</label><select class="form-select" name="travel_style">{% for style in ['Adventure','Relaxed','Culture','Luxury','Budget','Flexible'] %}<option {% if user.travel_style==style %}selected{% endif %}>{{ style }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Usual trip budget (₹)</label><input class="form-control" type="number" min="0" name="budget" value="{{ user.budget }}"></div></div><button class="btn btn-dark btn-lg mt-4" type="submit">Save profile ↗</button></form></div></section>{% endblock %}
